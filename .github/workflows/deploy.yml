name: Predict & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # 10분마다 예측 파이프라인을 다시 돌리고 사이트를 재배포한다.
    # (GitHub은 스케줄이 부하 상황에 따라 몇 분 늦게 실행될 수 있다고 명시함 — 정확한 시각 보장은 아님)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write # services/predictor/data/*.json(정확도 기록)를 커밋해서 되돌려 넣어야 함
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install predictor dependencies
        working-directory: services/predictor
        run: pip install -r requirements.txt

      - name: Run prediction pipeline (writes apps/web/public/predictions.json)
        working-directory: services/predictor
        env:
          # Supabase 연동 전까지는 비워둬도 dry-run으로 정상 동작함
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 공매도비율(collectors/flows.py, pykrx) — data.krx.co.kr 로그인 계정.
          # 없으면 short_selling_ratio가 None으로 빠질 뿐 파이프라인은 계속 동작함.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python main.py

      - name: Commit accuracy records (git-tracked, accumulates across runs)
        # 로컬 PC도 같은 디렉터리(특히 token_change_cache.json)를 독립적으로
        # 커밋+푸시하므로(git_sync.py) 동시에 겹치면 non-fast-forward로
        # 거절될 수 있다 — pull --rebase 후 재시도. 그래도 실패하면 이번
        # 사이클의 기록 커밋만 건너뛰고(다음 사이클에 다시 시도) 사이트
        # 배포(build/deploy 스텝)는 계속 진행되도록 continue-on-error.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/predictor/data/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: 예측/정확도 기록 갱신 [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 실패(시도 $i) — pull --rebase 후 재시도"
            git pull --rebase || { echo "rebase 실패 — 이번 사이클 커밋 포기"; exit 0; }
          done
          echo "push 3회 재시도 모두 실패 — 이번 사이클 커밋 포기"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build static export
        working-directory: apps/web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - id: deployment
        uses: actions/deploy-pages@v4
