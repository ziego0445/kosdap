name: Predict & Deploy to GitHub Pages

on:
  # 배포는 보류 중 (사용자 요청, 2026-08-06) — push/schedule 트리거를 꺼뒀다.
  # 켜져 있으면 GitHub Pages가 아직 설정 안 된 상태에서도 매 push/10분마다
  # 실행되다가 deploy-pages 단계에서 계속 실패해 Actions 분량을 낭비하고
  # 실패 알림 메일이 쌓인다. 실제 배포 준비되면 아래 두 블록 주석을 풀 것:
  #
  # push:
  #   branches: [master]
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install predictor dependencies
        working-directory: services/predictor
        run: pip install -r requirements.txt

      - name: Run prediction pipeline (writes apps/web/public/predictions.json)
        working-directory: services/predictor
        env:
          # Supabase 연동 전까지는 비워둬도 dry-run으로 정상 동작함
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build static export
        working-directory: apps/web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

      - id: deployment
        uses: actions/deploy-pages@v4
